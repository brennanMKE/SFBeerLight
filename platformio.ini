; SF Beer Light: a 14-LED WS2812B strip on an ESP32-C3, adapted from GlowLamp
; with the WiFi, REST, MQTT and OTA layers removed. It runs the default blend
; effect over GlowLamp's palette from power-on, with nothing to configure.

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    FastLED

[platformio]
default_envs = esp32c3
